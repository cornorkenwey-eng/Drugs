<html lang="en">

<meta name="mobile-web-app-capable" content="yes">

<style>
/* VOICE: calm, clinical, quick to scan on a ward round
   IDEA: a pocket drug-chart card from a Sri Lankan ward, with a sketchbook margin
   PICTURE: per-drug sketch scene (3 panels) + mechanism flow
   COLOUR and TYPE: white chart paper, deep teal ink, marker-red accent; Lora body, Caveat for sketches
   LAYOUT: sticky search, chips, list; full-screen drug card; bottom tabs */
:root{color-scheme:light dark;--bg:light-dark(#f6f8f7,#0f1716);--card:light-dark(#fff,#16211f);--ink:light-dark(#14211f,#e6efed);--mute:light-dark(#5b6b68,#9fb2ae);--teal:light-dark(#0b6e65,#4fc2b4);--tealbg:light-dark(#e3f2ef,#173a35);--red:light-dark(#c8342b,#ff7b70);--line:light-dark(#d9e3e0,#28403b);--paper:light-dark(#fffdf4,#1d2522)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Lora,Georgia,serif;overflow-x:clip;padding-bottom:76px}
button,input,textarea{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px max(4vw,14px) 8px;border-bottom:1px solid var(--line)}
h1{font-size:22px;margin:0 0 8px;line-height:1.1;display:flex;align-items:center;gap:8px}
h1 small{font-size:13px;color:var(--mute);font-weight:400}
.search{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);font-size:16px}
.search:focus,textarea:focus{outline:2px solid var(--teal);border-color:var(--teal)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 12px;font-size:14px;cursor:pointer;min-height:36px}
.chip.on{background:var(--teal);color:#fff;border-color:var(--teal)}
main{padding:10px max(4vw,14px);max-width:900px;margin:0 auto}
.count{font-size:13px;color:var(--mute);margin:4px 2px 8px}
.item{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 12px;margin-bottom:8px;cursor:pointer;width:100%;text-align:left}
.item:focus-visible{outline:2px solid var(--teal)}
.dot{flex:none;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:22px;background:var(--tealbg)}
.item b{display:block;font-size:17px}
.item span{display:block;font-size:13px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.star{margin-left:auto;flex:none;color:var(--red);font-size:18px}
nav.tabs{position:fixed;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(4,1fr);background:var(--card);border-top:1px solid var(--line);z-index:6;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{border:0;background:none;padding:8px 4px 10px;font-size:12px;cursor:pointer;min-height:58px;color:var(--mute)}
nav.tabs button i{display:block;font-style:normal;font-size:20px}
nav.tabs button.on{color:var(--teal);font-weight:700}
#sheet{position:fixed;inset:0;background:var(--bg);z-index:10;overflow-y:auto;display:none}
#sheet.open{display:block}
.top{position:sticky;top:0;background:var(--teal);color:#fff;padding:10px max(4vw,14px);display:flex;align-items:center;gap:10px;z-index:2}
.top button{background:rgba(255,255,255,.18);border:0;color:#fff;border-radius:10px;min-width:44px;min-height:40px;font-size:18px;cursor:pointer}
.top h2{margin:0;font-size:21px;line-height:1.1;flex:1}
.top h2 small{display:block;font-size:13px;font-weight:400;opacity:.9}
.wrap{max-width:820px;margin:0 auto;padding:14px max(4vw,14px) 40px}
.quick{background:var(--card);border:1.5px solid var(--teal);border-radius:14px;padding:12px 14px;margin-bottom:14px}
.quick .lab{font-size:13px;color:var(--teal);font-weight:700;margin-top:6px}
.quick .lab:first-child{margin-top:0}
.sketch{background:var(--paper);border:1.5px dashed var(--line);border-radius:14px;padding:12px;margin-bottom:14px}
.sketch h3,.sec h3{margin:0 0 8px;font-size:15px;color:var(--teal)}
.panels{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.panel{background:var(--card);border:2px solid var(--ink);border-radius:6px 14px 8px 12px;padding:10px 6px;text-align:center;transform:rotate(var(--r));box-shadow:3px 3px 0 var(--line)}
.panel .e{font-size:40px;line-height:1.1}
.panel p{margin:4px 0 0;font:600 17px/1.15 Caveat,cursive}
.mn{font:700 22px/1.25 Caveat,cursive;color:var(--red);margin:10px 2px 0}
.flow{display:flex;flex-direction:column;align-items:stretch;gap:0;margin-bottom:14px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.fbox{border-radius:10px;padding:9px 12px;font-size:15px;text-align:center}
.fdrug{background:var(--teal);color:#fff;font-weight:700}
.ftgt{background:var(--tealbg);display:flex;align-items:center;gap:10px;text-align:left}
.ftgt svg{flex:none}
.feff{border:1.5px solid var(--teal)}
.arr{text-align:center;font-size:13px;font-weight:700;padding:3px 0;color:var(--mute)}
.arr.b{color:var(--red)}
.sec{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.sec p{margin:0}
.sec.warn{border-left:4px solid var(--red)}
.sec.hx{border-left:4px solid var(--teal)}
.brand{display:flex;flex-wrap:wrap;gap:6px}
.brand span{background:var(--tealbg);border-radius:8px;padding:4px 9px;font-size:14px}
.favbtn{background:var(--card)!important;color:var(--red)!important}
textarea{width:100%;min-height:130px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);padding:12px;font-size:16px}
.btn{background:var(--teal);color:#fff;border:0;border-radius:12px;padding:12px 18px;min-height:46px;font-weight:700;cursor:pointer}
.btn.ghost{background:var(--card);color:var(--teal);border:1.5px solid var(--teal)}
.res{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:10px;cursor:pointer}
.res b{font-size:17px}.res .k{font-size:13px;color:var(--teal);font-weight:700;margin-top:4px}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}
.opt{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:12px;min-height:52px;cursor:pointer;font-weight:600}
.opt.ok{background:#1f8a5b;color:#fff;border-color:#1f8a5b}.opt.no{background:var(--red);color:#fff;border-color:var(--red)}
.score{font-size:14px;color:var(--mute)}
.note{font-size:13px;color:var(--mute);margin:18px 2px}
.empty{text-align:center;color:var(--mute);padding:40px 10px}
@media(max-width:420px){.panel .e{font-size:32px}.panel p{font-size:15px}}
@media(prefers-reduced-motion:reduce){.panel{transform:none}}
</style>
</head>
<body>
<header id="hdr">
  <h1>💊 Ward Drug Pocketbook <small>Sri Lanka · rounds &amp; history</small></h1>

<main id="main"></main>
<div id="sheet" role="dialog" aria-modal="true"></div>

</nav>
<script>
{

const R=[
["Amlodipine","Norvasc, Amlong","Calcium channel blocker (dihydropyridine)","CV","L-type Ca²⁺ channels in arteriolar smooth muscle|b|Arteriolar dilatation → ↓ BP, ↓ afterload","Blocks L-type calcium channels in vascular smooth muscle. Little effect on the heart.","Hypertension (NICE step 1 if ≥55 y or Black African/Caribbean). Stable angina.","5 mg OD, up to 10 mg OD.","Ankle oedema, flushing, headache, palpitations, gum hypertrophy.","Cardiogenic shock, severe aortic stenosis, unstable angina.","Simvastatin (max 20 mg). CYP3A4 inhibitors raise levels.","BP, ankle swelling.","Hypertension or angina.","Ankle swelling? Headache? Flushing?","-DIPINE dilates the PIPEs (arteries) → puffy ankles","🦶 Balloon ankles|🔥 Red hot face|🦷 Gums growing"],
["Nifedipine","Adalat (MR / retard)","Calcium channel blocker (dihydropyridine)","CV","L-type Ca²⁺ channels (vascular + uterine smooth muscle)|b|Vasodilatation; uterine relaxation","Blocks L-type calcium channels. Relaxes arterioles and myometrium.","Hypertension in pregnancy (NICE NG133 if labetalol unsuitable). Tocolysis (RCOG). Angina. Raynaud's.","MR 10–40 mg BD. Tocolysis: 20 mg oral load then 10–20 mg 6–8 hourly (unit protocol).","Headache, flushing, oedema, reflex tachycardia, hypotension.","Cardiogenic shock. Avoid immediate-release sublingual (sudden BP crash).","Magnesium sulfate (hypotension). CYP3A4 inhibitors.","BP, pulse, CTG in tocolysis.","Pregnancy hypertension, preterm labour, or Raynaud's.","Headache? Palpitations?","Ni-FED-ipine: FEDs the uterus a calm-down pill","🤰 Calm uterus|🤕 Headache|❄️ Warm fingers"],
["Losartan","Cozaar, Losar","Angiotensin II receptor blocker (ARB)","CV","AT1 receptor|b|↓ Vasoconstriction, ↓ aldosterone","Blocks angiotensin II at AT1 receptors. No bradykinin build-up, so little cough.","Hypertension (if ACEi cough), heart failure, diabetic nephropathy, CKD with proteinuria.","50 mg OD, up to 100 mg. HF: start 12.5 mg.","Hyperkalaemia, dizziness, AKI, hypotension.","Pregnancy, bilateral renal artery stenosis, hyperkalaemia.","K⁺-sparing diuretics, NSAIDs (triple whammy with diuretic), lithium.","U&E and K⁺ at baseline and 1–2 weeks after start or dose change.","HTN in diabetic/CKD patient, or past ACEi cough.","Dizziness? Pregnancy plans?","-SARTAN blocks the Seat (receptor) – no cough","🔒 Lock on receptor|🍌 Banana pile (K⁺)|🤰🚫 No pregnancy"],

["Atenolol","Tenormin","β1-selective blocker","CV","β1 receptors (heart)|b|↓ HR, ↓ contractility, ↓ renin","Blocks β1 receptors. Slows heart rate and lowers cardiac output. Renally excreted.","Angina, AF rate control, hypertension (not first line), anxiety symptoms.","25–100 mg OD.","Bradycardia, fatigue, cold peripheries, bronchospasm, erectile dysfunction, masks hypoglycaemia.","Asthma, 2nd/3rd degree heart block, decompensated HF, severe PAD.","Verapamil/diltiazem (asystole risk).","Pulse, BP.","Angina, AF, or older HTN regimen.","Tired? Cold hands? Wheeze? Dizzy?","β1-selective: A BEAM – Acebutolol, Bisoprolol, Esmolol, Atenolol, Metoprolol","🐢 Slow heart|🥶 Cold hands|🫁 Tight chest"],

["Spironolactone","Aldactone","Aldosterone antagonist (K⁺-sparing diuretic)","CV","Mineralocorticoid receptor (collecting duct)|b|Na⁺ loss, K⁺ retention","Competes with aldosterone in the collecting duct. Also anti-androgen.","HFrEF, ascites in cirrhosis, primary hyperaldosteronism, resistant HTN, PCOS hirsutism.","HF: 25 mg OD. Ascites: 100 mg up to 400 mg OD.","Hyperkalaemia, gynaecomastia, menstrual upset, AKI.","Hyperkalaemia, Addison's, anuria.","ACEi/ARB (K⁺ ↑), K⁺ supplements, NSAIDs.","K⁺ and creatinine (1 week, then regularly).","Heart failure or chronic liver disease with ascites.","Breast enlargement/tenderness?","Spiro makes 'spheres' – gynaecomastia; K⁺ Keeper","🍌 K⁺ kept|👙 Man boobs|🎈 Ascites drains"],

["Amiodarone","Cordarone","Class III antiarrhythmic","CV","K⁺ channels (plus Na⁺, Ca²⁺, β)|b|Prolonged action potential & refractory period","Mainly blocks K⁺ channels. Also class I, II, IV effects. Very long half-life.","AF/VT, cardiac arrest (shock-refractory VF/pVT: 300 mg IV).","Oral: 200 mg TDS 1 week, BD 1 week, then OD.","Hypo/hyperthyroidism, pulmonary fibrosis, hepatitis, photosensitivity, slate-grey skin, corneal deposits, neuropathy, QT prolongation.","Sinus bradycardia, heart block, iodine allergy, thyroid disease.","Warfarin & digoxin (↑ levels), statins, QT drugs.","TFT, LFT before and 6-monthly; CXR baseline.","AF/arrhythmia history.","Breathless? Sun rash? Thyroid symptoms?","Amiodarone? Check PFTs, LFTs, TFTs","🦋 Thyroid|☀️ Blue-grey sun skin|🫁 Stiff lungs"],

["Labetalol","Trandate","α1 + β blocker","OB","α1, β1, β2 receptors|b|↓ BP without ↓ uteroplacental flow","Mixed α/β block. First line for pregnancy hypertension (NICE NG133).","Hypertension in pregnancy, severe hypertension (IV), hypertensive emergency.","100 mg BD, up to 2.4 g/day. IV 20 mg bolus or infusion.","Postural hypotension, fatigue, bronchospasm, neonatal bradycardia/hypoglycaemia, scalp tingling.","Asthma, heart block.","Other antihypertensives.","BP, pulse; neonatal glucose.","Pregnancy hypertension.","Asthma history?","LABetalol for the LABour ward BP","🤰 Pregnancy BP|🫁🚫 Asthma|👶 Baby sugar check"],
["Methyldopa","Aldomet","Central α2 agonist","OB","Central α2 receptors (via α-methylnoradrenaline)|a|↓ Sympathetic outflow","Long safety record in pregnancy.","Hypertension in pregnancy (if labetalol/nifedipine unsuitable).","250 mg BD–TDS, max 3 g/day. Stop within 2 days after birth (NICE – depression risk).","Sedation, depression, dry mouth, positive Coombs test, haemolytic anaemia, hepatitis.","Depression, active liver disease, phaeochromocytoma.","MAOI, iron (↓ absorption).","LFT, FBC, mood.","Pregnancy hypertension.","Mood? Sleepy?","Methyldopa: Moody (depression) – stop postnatally","😔 Low mood|😴 Sleepy|🔴 Coombs +"],
["Adrenaline","Generic 1 mg/ml (1:1000); EpiPen","α + β adrenergic agonist","MI","α1, β1, β2 receptors|a|Vasoconstriction, ↑ cardiac output, bronchodilatation","Reverses anaphylaxis: raises BP, opens airways, stabilises mast cells.","Anaphylaxis, cardiac arrest, severe asthma, croup (neb).","Anaphylaxis 0.5 mg IM (0.5 ml of 1:1000) anterolateral thigh, repeat after 5 min. Arrest 1 mg IV every 3–5 min.","Tachycardia, arrhythmia, hypertension, anxiety, tremor.","None in anaphylaxis.","β-blockers (reduced response – consider glucagon).","ECG, BP.","History of anaphylaxis.","Carries an autoinjector?","Anaphylaxis: 0.5 of 1-in-1000 IM in the thigh","🦵 Thigh jab|🫁 Airway opens|💓 Heart races"],
["Allopurinol","Zyloric","Xanthine oxidase inhibitor","MI","Xanthine oxidase|b|↓ Uric acid production","Blocks purine breakdown to uric acid.","Gout prophylaxis (treat to target urate <360, <300 if tophi – NICE NG219), tumour lysis prevention, urate stones.","100 mg OD, increase by 100 mg every 4 weeks.","Rash, SJS/DRESS (HLA-B*5801), acute flare on starting (cover with colchicine/NSAID).","Hypersensitivity.","Azathioprine/mercaptopurine (severe marrow toxicity).","Urate, U&E.","Recurrent gout.","Rash? Flare frequency?","Allopurinol + Azathioprine = Aplastic disaster","🦶 Gout prevented|🔴 Rash|☠️ Azathioprine clash"],
["Colchicine","Colcrys, generic","Anti-inflammatory (anti-mitotic)","MI","Tubulin (microtubule polymerisation)|b|↓ Neutrophil migration","Stops neutrophils moving into the joint.","Acute gout, flare prophylaxis when starting allopurinol, pericarditis, FMF.","Gout: 500 mcg BD–QDS, max 6 mg per course.","Diarrhoea, vomiting, myopathy, marrow suppression in toxicity.","Severe renal impairment, pregnancy.","Clarithromycin, statins, ciclosporin (toxicity).","Renal function.","Gout or pericarditis.","Diarrhoea?","Colchicine causes Colitis-like diarrhoea","🦶🔥 Hot toe cools|🚽 Diarrhoea|🧬 Microtubules"],
["Chlorphenamine","Piriton, Histal","Sedating H1 antihistamine","MI","H1 receptors|b|↓ Itch, urticaria","First-generation antihistamine; crosses BBB.","Allergy, urticaria, anaphylaxis (adjunct after adrenaline), pruritus.","4 mg 4–6 hourly (max 24 mg/day). IM/IV 10 mg.","Drowsiness, anticholinergic effects, psychomotor impairment.","Caution in glaucoma, prostatism, epilepsy.","Alcohol, sedatives.","—","Allergy.","Sleepy?","First-generation antihistamines: Feel sleepy","😴 Drowsy|🐝 Itch stops|🏜️ Dry mouth"],
["Cetirizine","Zyrtec, Alerid","Non-sedating H1 antihistamine","MI","Peripheral H1 receptors|b|↓ Allergic symptoms","Second generation – little BBB penetration.","Allergic rhinitis, urticaria.","10 mg OD.","Mild drowsiness, headache, dry mouth.","Severe renal impairment (dose reduce).","Alcohol (mild).","—","Allergy or rhinitis.","—","Cetirizine – Clear nose, Clear head","🤧 Clear nose|🧠 Clear head|🌸 Pollen"]
];
const D=R.map((r,i)=>{const[t,a,e]=r[4].split("|");return{id:i,slug:r[0].toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,""),g:r[0],b:r[1],c:r[2],cat:r[3],t,a,e,mech:r[5],use:r[6],dose:r[7],se:r[8],ci:r[9],int:r[10],mon:r[11],hx:r[12],ask:r[13],mn:r[14],sk:r[15].split("|").map(s=>{const k=s.indexOf(" ");return[s.slice(0,k),s.slice(k+1)]})}});
const ALIAS={acetaminophen:"Paracetamol",frusemide:"Furosemide",trihexyphenidyl:"Benzhexol",gtn:"Nitrates",ismn:"Nitrates",isosorbide:"Nitrates",esomeprazole:"Omeprazole",pantoprazole:"Omeprazole",lansoprazole:"Omeprazole",rabeprazole:"Omeprazole",ranitidine:"Famotidine",budesonide:"Inhaled",beclometasone:"Inhaled",beclomethasone:"Inhaled",fluticasone:"Inhaled",seretide:"Inhaled",symbicort:"Inhaled",empagliflozin:"SGLT2",dapagliflozin:"SGLT2",gabapentin:"Pregabalin",rifampicin:"Anti-TB",isoniazid:"Anti-TB",pyrazinamide:"Anti-TB",ethambutol:"Anti-TB",cloxacillin:"Flucloxacillin",penicillin:"Benzylpenicillin",insulin:"Insulin",mixtard:"Insulin",actrapid:"Insulin",epinephrine:"Adrenaline",chlorpheniramine:"Chlorphenamine",procyclidine:"Benzhexol",theophylline:"Aminophylline",aminophylline:"Aminophylline",hctz:"Hydrochlorothiazide",cephalexin:"Cefalexin",ceftriaxon:"Ceftriaxone",acyclovir:"Aciclovir",epilim:"Sodium valproate",valproate:"Sodium valproate",thyroxine:"Levothyroxine",iron:"Ferrous",ferrous:"Ferrous",mgso4:"Magnesium",magnesium:"Magnesium",txa:"Tranexamic"};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let fav=new Set();try{fav=new Set(JSON.parse(localStorage.getItem("wdp-fav")||"[]"))}catch(e){}
const saveFav=()=>{try{localStorage.setItem("wdp-fav",JSON.stringify([...fav]))}catch(e){}};
let view="list",cat="ALL",q="";
const chips=$("#chips");
chips.innerHTML=[["ALL","All"]].concat(Object.entries(CATS).map(([k,v])=>[k,v[0]+" "+v[1]])).map(([k,l])=>`<button class="chip${k==="ALL"?" on":""}" data-c="${k}">${l}</button>`).join("");
chips.addEventListener("click",e=>{const b=e.target.closest(".chip");if(!b)return;cat=b.dataset.c;chips.querySelectorAll(".chip").forEach(x=>x.classList.toggle("on",x===b));render()});
$("#q").addEventListener("input",e=>{q=e.target.value.trim().toLowerCase();if(view!=="list")setView("list");else render()});
const hay=d=>(d.g+" "+d.b+" "+d.c+" "+d.use+" "+d.hx).toLowerCase();
const itemHTML=d=>`<button class="item" data-id="${d.id}"><span class="dot">${CATS[d.cat][0]}</span><span style="flex:1;min-width:0"><b>${esc(d.g)}</b><span>${esc(d.c)}</span><span>🏷️ ${esc(d.b)}</span></span>${fav.has(d.slug)?'<span class="star">★</span>':""}</button>`;
function listView(arr,emptyMsg){return arr.length?`<div class="count">${arr.length} drug${arr.length>1?"s":""}</div>`+arr.map(itemHTML).join(""):`<div class="empty">${emptyMsg}</div>`}
function render(){
  const m=$("#main");$("#hdr").style.display=view==="list"?"":"none";
  if(view==="list"){
    let arr=D.filter(d=>(cat==="ALL"||d.cat===cat)&&(!q||hay(d).includes(q)));
    if(q){const al=Object.keys(ALIAS).find(k=>q.includes(k)||k.startsWith(q));if(al){const t=ALIAS[al].toLowerCase();D.forEach(d=>{if(d.g.toLowerCase().startsWith(t)&&!arr.includes(d))arr.unshift(d)})}
      arr.sort((x,y)=>(y.g.toLowerCase().startsWith(q)?2:y.b.toLowerCase().includes(q)?1:0)-(x.g.toLowerCase().startsWith(q)?2:x.b.toLowerCase().includes(q)?1:0))}
    m.innerHTML=listView(arr,"No match. Try the generic name or a brand.")+`<p class="note">For learning and quick reference only. Doses are typical adult doses from BNF/NICE/RCOG-style guidance. Always confirm with the BNF, the Sri Lanka National Formulary and local unit protocols. Brand names vary between pharmacies – check NMRA listings.</p>`;
  }else if(view==="fav"){
    m.innerHTML=`<h2 style="margin:6px 0 4px">★ Saved drugs</h2>`+listView(D.filter(d=>fav.has(d.slug)),"Nothing saved yet. Tap ☆ on a drug card to save it for rounds.");
  }else if(view==="hx"){
    m.innerHTML=`<h2 style="margin:6px 0 4px">📝 Drug history decoder</h2><p style="margin:0 0 10px;color:var(--mute);font-size:15px">Type the patient's drug list (generic or brand, one per line or separated by commas). See what each drug suggests in the history and what to ask.</p><textarea id="hxin" placeholder="e.g.&#10;Losar 50mg&#10;Glucophage 500 bd&#10;Concor 2.5&#10;Lasix 40 mane&#10;Modecate depot, Artane 2mg"></textarea><div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap"><button class="btn" id="hxgo">Decode list</button><button class="btn ghost" id="hxex">Try example</button></div><div id="hxout"></div>`;
    const go=()=>{const lines=$("#hxin").value.split(/[\n,;+]+/).map(s=>s.trim()).filter(Boolean);const found=[],miss=[];
      lines.forEach(l=>{const w=l.toLowerCase().replace(/[0-9.]+\s*(mg|mcg|g|ml|iu|units?)?/g," ").replace(/\b(od|bd|tds|qds|nocte|mane|prn|stat|daily|tab|tablet|sr|mr|xl|depot|inj)\b/g," ").replace(/\s+/g," ").trim();if(!w)return;
        let d=D.find(d=>d.g.toLowerCase().includes(w)||w.includes(d.g.toLowerCase().split(/[ (\/]/)[0]));
        if(!d)d=D.find(d=>d.b.toLowerCase().split(/[,;()]+/).some(b=>{b=b.trim().split(" ")[0];return b.length>2&&(w.includes(b)||b.includes(w.split(" ")[0]))}));
        if(!d){const al=Object.keys(ALIAS).find(k=>w.includes(k));if(al)d=D.find(x=>x.g.toLowerCase().startsWith(ALIAS[al].toLowerCase()))}
        if(d){if(!found.includes(d))found.push(d)}else miss.push(l)});
      $("#hxout").innerHTML=found.map(d=>`<div class="res" data-id="${d.id}"><b>${CATS[d.cat][0]} ${esc(d.g)}</b> <span style="color:var(--mute);font-size:14px">· ${esc(d.c)}</span><div class="k">Suggests</div><div>${esc(d.hx)}</div><div class="k">Ask the patient</div><div>${esc(d.ask)}</div><div class="k">Key side effects</div><div style="font-size:15px">${esc(d.se)}</div></div>`).join("")+(miss.length?`<p class="note">Not in the pocketbook yet: ${miss.map(esc).join(", ")}</p>`:"")+(found.length?"":(miss.length?"":`<p class="note">Type at least one drug.</p>`));};
    $("#hxgo").onclick=go;$("#hxex").onclick=()=>{$("#hxin").value="Losar 50mg\nGlucophage 500 bd\nConcor 2.5\nLasix 40 mane\nModecate depot\nArtane 2mg";go()};
  }else if(view==="quiz")quiz();
}
let qs={n:0,ok:0};
function quiz(){
  const d=D[Math.floor(Math.random()*D.length)];
  const pool=D.filter(x=>x.id!==d.id&&x.cat===d.cat);const others=(pool.length>=3?pool:D.filter(x=>x.id!==d.id)).sort(()=>Math.random()-.5).slice(0,3);
  const opts=[d,...others].sort(()=>Math.random()-.5);
  $("#main").innerHTML=`<h2 style="margin:6px 0 2px">🎯 Name that drug from the sketch</h2><div class="score">Score ${qs.ok}/${qs.n} · ${CATS[d.cat][1]}</div><div class="sketch" style="margin-top:10px">${panels(d)}<div class="k" style="margin-top:10px;font-size:14px;color:var(--mute)">Clue: ${esc(d.c)}</div></div><div class="opts">${opts.map(o=>`<button class="opt" data-id="${o.id}">${esc(o.g)}</button>`).join("")}</div><div id="qfb"></div>`;
  $("#main").querySelectorAll(".opt").forEach(b=>b.onclick=()=>{if($("#main").querySelector(".opt.ok,.opt.no"))return;qs.n++;const right=+b.dataset.id===d.id;if(right)qs.ok++;
    $("#main").querySelectorAll(".opt").forEach(x=>{if(+x.dataset.id===d.id)x.classList.add("ok");else if(x===b)x.classList.add("no")});
    $("#qfb").innerHTML=`<div class="sec" style="margin-top:12px"><p><b>${right?"Correct!":"It was "+esc(d.g)+"."}</b></p><p class="mn" style="margin-top:4px">${esc(d.mn)}</p><div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap"><button class="btn" id="qn">Next sketch</button><button class="btn ghost" id="qo">Open drug card</button></div></div>`;
    $("#qn").onclick=quiz;$("#qo").onclick=()=>openDrug(d.slug)});
}
const panels=d=>`<div class="panels">${d.sk.map((s,i)=>`<div class="panel" style="--r:${[-1.5,1,-.6][i]}deg"><div class="e">${s[0]}</div><p>${esc(s[1])}</p></div>`).join("")}</div>`;
const rec=b=>b==="b"?`<svg width="46" height="46" viewBox="0 0 46 46" aria-hidden="true"><path d="M8 40V18a15 15 0 0 1 30 0v22" fill="none" stroke="currentColor" stroke-width="3"/><rect x="15" y="6" width="16" height="16" rx="4" fill="#c8342b"/><path d="M17 8l12 12M29 8L17 20" stroke="#fff" stroke-width="2.5"/></svg>`:`<svg width="46" height="46" viewBox="0 0 46 46" aria-hidden="true"><path d="M8 40V18a15 15 0 0 1 30 0v22" fill="none" stroke="currentColor" stroke-width="3"/><circle cx="23" cy="20" r="8" fill="#1f8a5b"/><path d="M19 20l3 3 5-6" stroke="#fff" stroke-width="2.5" fill="none"/></svg>`;
function openDrug(slug){const d=D.find(x=>x.slug===slug);if(!d)return;const sh=$("#sheet");const f=fav.has(d.slug);
  const sec=(t,v,cls)=>v&&v!=="—"?`<div class="sec ${cls||""}"><h3>${t}</h3><p>${esc(v)}</p></div>`:"";
  sh.innerHTML=`<div class="top"><button id="back" aria-label="Back">←</button><h2>${esc(d.g)}<small>${CATS[d.cat][0]} ${esc(d.c)}</small></h2><button id="fv" class="favbtn" aria-label="Save">${f?"★":"☆"}</button></div><div class="wrap">
  <div class="quick"><div class="lab">ROUNDS QUICK CARD</div><div><b>Used for:</b> ${esc(d.use)}</div><div class="lab">Dose</div><div>${esc(d.dose)}</div><div class="lab">Watch for</div><div>${esc(d.se)}</div></div>
  <div class="sketch"><h3>✏️ Sketch scene</h3>${panels(d)}<p class="mn">“${esc(d.mn)}”</p></div>
  <div class="flow"><h3 style="margin:0 0 8px;font-size:15px;color:var(--teal)">⚙️ How it works</h3><div class="fbox fdrug">${esc(d.g)}</div><div class="arr ${d.a}">${d.a==="b"?"⊣ BLOCKS / INHIBITS":"→ STIMULATES / ACTIVATES"}</div><div class="fbox ftgt">${rec(d.a)}<span>${esc(d.t)}</span></div><div class="arr">↓</div><div class="fbox feff">${esc(d.e)}</div><p style="margin:10px 2px 0;font-size:15px">${esc(d.mech)}</p></div>
  <div class="sec hx"><h3>📝 In the history</h3><p><b>On this drug → think:</b> ${esc(d.hx)}</p><p style="margin-top:6px"><b>Ask:</b> ${esc(d.ask)}</p></div>
  ${sec("⛔ Contraindications",d.ci,"warn")}${sec("🔀 Interactions",d.int,"warn")}${sec("📊 Monitoring",d.mon)}
  <div class="sec"><h3>🏷️ Brands (Sri Lanka – verify locally)</h3><div class="brand">${d.b.split(/,\s*/).map(x=>`<span>${esc(x)}</span>`).join("")}</div></div>
  <p class="note">Check doses against the BNF / SL National Formulary and your unit protocol before prescribing.</p></div>`;
  sh.classList.add("open");sh.scrollTop=0;
  $("#back").onclick=closeDrug;
  $("#fv").onclick=()=>{fav.has(d.slug)?fav.delete(d.slug):fav.add(d.slug);saveFav();$("#fv").textContent=fav.has(d.slug)?"★":"☆";render()};
  if(location.hash!=="#d-"+d.slug)location.hash="d-"+d.slug;
}
function closeDrug(){$("#sheet").classList.remove("open");if(location.hash)history.pushState("",document.title,location.pathname+location.search)}
window.addEventListener("hashchange",()=>{const h=location.hash.slice(1);if(h.startsWith("d-"))openDrug(h.slice(2));else $("#sheet").classList.remove("open")});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&$("#sheet").classList.contains("open"))closeDrug()});
$("#main").addEventListener("click",e=>{const b=e.target.closest("[data-id]");if(b&&!b.classList.contains("opt"))openDrug(D[+b.dataset.id].slug)});
function setView(v){view=v;$("#tabs").querySelectorAll("button").forEach(b=>b.classList.toggle("on",b.dataset.v===v));render();window.scrollTo(0,0)}
$("#tabs").addEventListener("click",e=>{const b=e.target.closest("button");if(b)setView(b.dataset.v)});
render();
const h0=location.hash.slice(1);if(h0.startsWith("d-"))openDrug(h0.slice(2));
}
</script>
<script>if("serviceWorker" in navigator&&location.protocol==="https:"){navigator.serviceWorker.register("sw.js").catch(()=>{})}</script>
</body>
